<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juniper Café — Table Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #f5f4ef; }
    .cafe-top { background: #16302b; color: #fff; }
    .reservation-card { max-width: 780px; margin-inline: auto; border: 0; border-radius: 1.2rem; box-shadow: 0 1rem 3rem rgba(22,48,43,.09); }
    .reservation-card .form-control, .reservation-card .form-select { background-color: #fff; }
    .small-note { color: #697b74; font-size: .82rem; }
  </style>
</head>
<body>
  <header class="cafe-top py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="task3.html" class="text-white text-decoration-none fw-bold">Juniper Café</a>
      <span class="small">A seat saved for you</span>
    </div>
  </header>
  <main class="container py-4 py-lg-5">
    <section class="reservation-card card p-4 p-lg-5">
      <p class="eyebrow mb-2">COME ON IN</p>
      <h1 class="h2 fw-bold">Reserve a table</h1>
      <p class="small-note mb-4">Tell us when you're visiting and we'll prepare your table.</p>
      <form action="#" method="get">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="guest-name">Full name *</label>
            <input class="form-control" id="guest-name" name="guest-name" type="text" autocomplete="name" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="guest-email">Email address *</label>
            <input class="form-control" id="guest-email" name="guest-email" type="email" autocomplete="email" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="guest-phone">Phone number *</label>
            <input class="form-control" id="guest-phone" name="guest-phone" type="tel" autocomplete="tel" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="guest-count">Number of guests *</label>
            <select class="form-select" id="guest-count" name="guest-count" required>
              <option value="" selected disabled>Choose guests</option>
              <option value="1">1 guest</option><option value="2">2 guests</option>
              <option value="3">3 guests</option><option value="4">4 guests</option>
              <option value="5">5 guests</option><option value="6">6 guests</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="reservation-date">Date *</label>
            <input class="form-control" id="reservation-date" name="reservation-date" type="date" required>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="reservation-time">Time *</label>
            <select class="form-select" id="reservation-time" name="reservation-time" required>
              <option value="" selected disabled>Choose a time</option>
              <option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option>
              <option>12:00</option><option>12:30</option><option>13:00</option><option>13:30</option>
              <option>14:00</option><option>14:30</option><option>15:00</option><option>15:30</option>
              <option>16:00</option><option>16:30</option><option>17:00</option><option>17:30</option>
              <option>18:00</option><option>18:30</option><option>19:00</option><option>19:30</option>
              <option>20:00</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="requests">Special requests (optional)</label>
            <textarea class="form-control" id="requests" name="requests" rows="3" placeholder="High chair, accessibility needs, or other notes"></textarea>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" id="privacy" name="privacy" type="checkbox" required>
              <label class="form-check-label" for="privacy">I agree that the café may use these details to manage my reservation. *</label>
            </div>
          </div>
          <div class="col-12 d-flex flex-column flex-sm-row gap-2 mt-4">
            <button class="btn btn-primary flex-grow-1" type="submit">Request a table</button>
            <button class="btn btn-outline-secondary" type="reset">Clear form</button>
          </div>
        </div>
      </form>
    </section>
    <p class="small-note text-center mt-3">Demo only: this form does not send a real reservation.</p>
  </main>
</body>
</html>
